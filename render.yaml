services:
  # Backend Service
  - type: web
    name: anket-tarama-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHONPATH
        value: .
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_MANUAL_REVIEW_QUESTIONS
        value: 4
      - key: ADMIN_TOKEN
        sync: false

  # Frontend Service
  - type: web
    name: anket-tarama-frontend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: anket-tarama-backend
          property: url
      - key: NEXT_PUBLIC_ADMIN_TOKEN
        sync: false
    routes:
      - path: /
        destination: /
    previewPlan: free
    disk:
      name: cache
      mountPath: /var/cache
      sizeGB: 1
    buildCache:
      paths:
        - frontend/node_modules
        - frontend/.next
